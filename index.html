<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Product Management</title>
    <link href="node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="node_modules/bootstrap-icons/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="node_modules/sweetalert2/dist/sweetalert2.min.css" rel="stylesheet" />
</head>

<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a href='#/products' class="navbar-brand fw-bold">Product Management</a>
            <a href="#/products/create" class="nav-link text-white" id="addBtn">Add Product</a>
        </div>
    </nav>

    <div class="container">
        <div id="errorPage" class="d-none">
            <h2 class="text-center mt-5">404 - Page Not Found</h2>
        </div>
        <div id="successAlert" class="alert alert-success alert-dismissible fade show d-none mt-3" role="alert">
            Product saved successfully!
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div id="tablePage">
            <div class="table-responsive">
                <table class="table table-hover table-striped">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Quantity</th>
                            <th>Price/Unit</th>
                            <th>Total</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="productTable">
                        <tr>
                            <td colspan="6" class="text-center">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="formPage" class="container d-none">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-dark text-white">
                        <h5 class="mb-0" id="formTitle">Add Product</h5>
                    </div>
                    <div class="card-body">
                        <div id="mineAlert" class="alert alert-danger alert-dismissible fade show d-none" role="alert">
                            Please Fill all the Fields!
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Product Name</label>
                            <input type="text" id="name" class="form-control" placeholder="e.g. Laptop" />
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Quantity</label>
                            <input type="number" id="quantity" class="form-control" placeholder="e.g. 10" />
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Price per Unit ($)</label>
                            <input type="number" id="price" class="form-control" placeholder="e.g. 25.00" />
                        </div>
                        <div class="mb-1">
                            <label class="form-label">Total Price ($)</label>
                            <input type="number" id="total" class="form-control bg-light" readonly />
                        </div>
                    </div>
                    <div class="card-footer d-flex justify-content-end gap-2">
                        <button class="btn btn-secondary" id="cancelBtn">Cancel</button>
                        <button type="button" class="btn btn-primary" id="saveBtn">Save</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
    <script src="node_modules/sweetalert2/dist/sweetalert2.min.js"></script>
    <script src="js/main.js"></script>

</body>

</html>
